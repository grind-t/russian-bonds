name: Daily Smoke

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  run-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 60s
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Run smoke
        env:
          T_INVEST_READONLY_TOKEN: ${{ secrets.T_INVEST_READONLY_TOKEN }}
        run: npm run test:e2e
